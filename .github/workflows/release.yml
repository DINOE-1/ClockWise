name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # The published APK must always be signed with the same stable key so users can install every
    # release on top of the previous one. Debug signing is only a beta fallback: when the secrets
    # are missing, a beta tag (v*-beta*) may ship a debug APK, while a stable tag fails instead of
    # publishing an APK that cannot update an installed build. Note each run signs the debug
    # fallback with the runner's ephemeral debug key, so a debug beta cannot update a previous one.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Pick the APK variant
        id: variant
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "dir=release" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" == *-beta* ]]; then
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "dir=debug" >> "$GITHUB_OUTPUT"
          else
            echo "::error::KEYSTORE_BASE64 is not configured; refusing to publish a stable APK that cannot update installed builds."
            exit 1
          fi

      - name: Restore release keystore
        if: steps.variant.outputs.task == 'assembleRelease'
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/clockwise-release.jks"

      - name: Assemble APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/clockwise-release.jks
        run: ./gradlew ":app:${{ steps.variant.outputs.task }}" --console=plain --stacktrace

      - name: Name APK after the tag
        run: cp "app/build/outputs/apk/${{ steps.variant.outputs.dir }}/app-${{ steps.variant.outputs.dir }}.apk" "Clockwise-${GITHUB_REF_NAME}.apk"

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "Clockwise-${GITHUB_REF_NAME}.apk"

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            args=(
              release create "$GITHUB_REF_NAME"
              --verify-tag
              --title "$GITHUB_REF_NAME"
              --generate-notes
            )
            case "$GITHUB_REF_NAME" in
              *-*) args+=(--prerelease) ;;
            esac
            gh "${args[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" "Clockwise-${GITHUB_REF_NAME}.apk" --clobber
